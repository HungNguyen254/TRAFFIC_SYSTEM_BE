services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: traffic_system_api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - APP_NAME=Traffic System BE
      - ENVIRONMENT=dev
      - DEBUG=True
      - HOST=0.0.0.0
      - PORT=8000
      - ALLOWED_ORIGINS=["http://127.0.0.1:5500", "http://localhost:5173", "http://localhost:3000", "http://localhost:8000"]
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/traffic_db
      - JWT_SECRET_KEY=dev-secret-key-change-in-production-must-be-long-enough
      - JWT_ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=1440
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - .:/app
      - /app/.venv
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]

  db:
    image: postgres:16-alpine
    container_name: traffic_system_db
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=traffic_db
    volumes:
      - traffic_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d traffic_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  traffic_pgdata:
