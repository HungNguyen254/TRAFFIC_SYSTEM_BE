[project]
name = "traffic-system-be"
version = "0.1.0"
description = "Traffic Congestion Prediction Backend with AI & ChatBot"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.162.0",
    "google-genai>=0.1.0",
    "joblib>=1.4.0",
    "networkx>=3.4",
    "psycopg2-binary>=2.9.13",
    "psycopg[binary]>=3.3.8",
    "pwdlib[bcrypt]>=0.2.0",
    "pydantic-settings>=2.16.2",
    "pyjwt>=2.9.0",
    "scikit-learn>=1.5.0",
    "slowapi>=0.1.10",
    "sqlalchemy>=2.1.8",
    "sqlmodel>=0.0.48",
]

[dependency-groups]
dev = [
    "httpx>=0.28.0",
    "pytest>=8.0.0",
    "ruff>=0.8.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py314"
